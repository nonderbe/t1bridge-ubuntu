# T1Bridge owns the T1 iBridge (USB configuration 2). The legacy apple-ibridge
# stack (configuration 1) conflicts with it, so it is kept from loading.
# apple_t1_socw takes over its ASOC.SOCW sleep/wake call.
install apple_ibridge /usr/bin/true
install apple_ib_tb /usr/bin/true
install apple_ib_als /usr/bin/true
install apple_touchbar /usr/bin/true
